[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ondewo-t2s-client"
version = "6.6.3"
description = "ONDEWO Text 2 Speech (T2S) Client library for Python"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ONDEWO GmbH", email = "office@ondewo.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Only what the shipped `ondewo` package actually imports. cffi, google-api-core,
# googleapis-common-protos, grpcio-reflection, grpcio-tools, numpy, polling and regex had zero
# import sites and only inflated the install (same prune as ondewo-nlu-client-python 941c7e7).
# grpc_reflection / grpc_tools still show up in sys.modules on `import grpc` because grpc's own
# _runtime_protos.py probes for them behind try/except - presence there is not use.
dependencies = [
    # Used by ondewo/t2s/client/client_config.py's @dataclass_json, which gives downstream callers
    # ClientConfig.from_json()/to_dict(). Unlike the s2t/nlu twins this repo still applies the
    # decorator, so the dependency is real and stays declared.
    "dataclasses-json",
    "grpcio>=1.65.5",
    "ondewo-client-utils>=3.2.0",
    "protobuf>=5.27.3",
    "requests",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "jupyter",
    "loguru",
    "mypy",
    "mypy-protobuf>=3.6.0",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "python-dotenv",
    "types-protobuf>=5.27.0.20240626",
    "typing_extensions",
]

[project.urls]
Homepage = "https://github.com/ondewo/ondewo-t2s-client-python"
Repository = "https://github.com/ondewo/ondewo-t2s-client-python"

# ---------------------------------------------------------------------------
# setuptools: package discovery + package data
# Equivalent to the old setup.py:
#   packages = [n for n in find_packages() if n == 'ondewo' or n.startswith('ondewo.')]
#   include_package_data=True + package_data for py.typed / *.pyi
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["ondewo", "ondewo.*"]

[tool.setuptools.package-data]
"ondewo.t2s" = ["py.typed", "*.pyi"]

# ---------------------------------------------------------------------------
# Coverage
#
# `source` is a FILESYSTEM root, not a list of dotted modules. That distinction is the whole
# point: pytest-cov only measures a dotted `--cov=<module>` target the test suite actually
# imports, so a module with zero tests is dropped from the report instead of being scored 0%
# and the gate reports "Required test coverage of 100% reached" while whole files are
# untested. Scanning `ondewo/` from disk measures every .py under it whether or not a test
# imports it, so a new untested file FAILS the gate. Same shape as
# ondewo-nlu-client-python 719ca86; .github/workflows/tests.yml passes a bare `--cov`.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["ondewo"]
omit = [
    # Generated protobuf/gRPC stubs (protoc + mypy-protobuf output, ~95% of the repo).
    # Not our code, regenerated by `make generate_ondewo_protos`. The .pyi stubs alongside
    # them are not executable Python and are never measured by coverage in the first place.
    "ondewo/*/*_pb2.py",
    "ondewo/*/*_pb2_grpc.py",
    # Developer-only codegen script run by `make generate_services`; it never executes at SDK
    # runtime and is not importable as a package (ondewo/t2s/scripts/ has no __init__.py).
    # It also cannot reach 100%: `proto_stem_to_file_name` starts with a bare `return stem`
    # (line 116), so the six lines below it are unreachable and no test can execute them.
    # Delete that dead code first, then port ondewo-nlu-client-python's
    # tests/unit/scripts/test_generate_services.py and drop this entry to gate it for real.
    "ondewo/t2s/scripts/generate_services.py",
]

[tool.coverage.report]
show_missing = true
# ondewo/t2s/scripts/ has no __init__.py, so coverage's package walk skips such directories
# entirely — the same fail-open shape as the dotted --cov form. This keeps any future
# __init__.py-less directory measured. The option belongs under [report]; putting it under
# [run] only emits "CoverageWarning: Unrecognized option".
include_namespace_packages = true
exclude_lines = [
    # Re-state the default: setting exclude_lines REPLACES coverage's built-in pragma pattern.
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Ruff  (replaces flake8: ignore C901; max-line-length 120; exclude *_pb2*)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py39"
# Never lint/format the generated protobuf/gRPC stubs (the old .flake8 excluded
# ondewo/t2s/text_to_speech_pb2* individually).
extend-exclude = [
    "*_pb2.py",
    "*_pb2.pyi",
    "*_pb2_grpc.py",
    # flake8 never linted Jupyter notebooks; keep example notebooks out of scope.
    "*.ipynb",
    "ondewo-t2s-api",
    "ondewo-proto-compiler",
]

[tool.ruff.lint]
# pycodestyle (E/W) + pyflakes (F) == the flake8 default rule set.
# C901 (mccabe complexity) is intentionally NOT enabled -> old "ignore = C901".
select = ["E", "F", "W"]
ignore = []

[tool.ruff.format]
# Supersedes the old black (async_ files) + autopep8 hooks.
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy  (translated faithfully from mypy.ini)
# ---------------------------------------------------------------------------
[tool.mypy]
# mypy.ini had python_version=3.9, but mypy 2.x refuses it outright:
# "python_version: Python 3.9 is not supported (must be 3.10 or higher)". 3.12 is the
# interpreter .github/workflows/tests.yml pins; runtime requires-python stays ">=3.9".
python_version = "3.12"
ignore_errors = false
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_traceback = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true

# Generated protobuf / gRPC stubs: never type-check them.
[[tool.mypy.overrides]]
module = [
    "ondewo.t2s.text_to_speech_pb2",
    "ondewo.t2s.text_to_speech_pb2_grpc",
]
ignore_errors = true
ignore_missing_imports = true

# Third-party packages this repo actually imports without (complete) type stubs.
[[tool.mypy.overrides]]
module = [
    "dataclasses_json.*",
    "google.*",
    "grpc.*",
    "ondewo.utils.*",
    "requests.*",
    # imported only by examples/ (checked by the pre-commit mypy hook), not a dep.
    "soundfile.*",
]
ignore_missing_imports = true
