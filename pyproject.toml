[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ondewo-t2s-client"
version = "6.6.2"
description = "ONDEWO Text 2 Speech (T2S) Client library for Python"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ONDEWO GmbH", email = "office@ondewo.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cffi",
    "dataclasses-json",
    "google-api-core>=2.19.1",
    "googleapis-common-protos>=1.63.2",
    "grpcio-reflection>=1.65.5",
    "grpcio-tools>=1.65.5",
    "grpcio>=1.65.5",
    "numpy",
    "ondewo-client-utils>=3.2.0",
    "polling>=0.3.2",
    "protobuf>=5.27.3",
    "regex>=2022.6.2",
    "requests",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "jupyter",
    "loguru",
    "mypy",
    "mypy-protobuf>=3.6.0",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "python-dotenv",
    "types-protobuf>=5.27.0.20240626",
    "typing_extensions",
]

[project.urls]
Homepage = "https://github.com/ondewo/ondewo-t2s-client-python"
Repository = "https://github.com/ondewo/ondewo-t2s-client-python"

# ---------------------------------------------------------------------------
# setuptools: package discovery + package data
# Equivalent to the old setup.py:
#   packages = [n for n in find_packages() if n == 'ondewo' or n.startswith('ondewo.')]
#   include_package_data=True + package_data for py.typed / *.pyi
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["ondewo", "ondewo.*"]

[tool.setuptools.package-data]
"ondewo.t2s" = ["py.typed", "*.pyi"]

# ---------------------------------------------------------------------------
# Ruff  (replaces flake8: ignore C901; max-line-length 120; exclude *_pb2*)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py39"
# Never lint/format the generated protobuf/gRPC stubs (the old .flake8 excluded
# ondewo/t2s/text_to_speech_pb2* individually).
extend-exclude = [
    "*_pb2.py",
    "*_pb2.pyi",
    "*_pb2_grpc.py",
    # flake8 never linted Jupyter notebooks; keep example notebooks out of scope.
    "*.ipynb",
    "ondewo-t2s-api",
    "ondewo-proto-compiler",
]

[tool.ruff.lint]
# pycodestyle (E/W) + pyflakes (F) == the flake8 default rule set.
# C901 (mccabe complexity) is intentionally NOT enabled -> old "ignore = C901".
select = ["E", "F", "W"]
ignore = []

[tool.ruff.format]
# Supersedes the old black (async_ files) + autopep8 hooks.
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy  (translated faithfully from mypy.ini)
# ---------------------------------------------------------------------------
[tool.mypy]
# mypy.ini had python_version=3.9, but current mypy requires >=3.10. Use 3.12 so
# mypy parses the numpy 2.x type stubs (which use PEP 695 `type X = ...` statements,
# valid only on 3.12+). Runtime requires-python stays ">=3.9".
python_version = "3.12"
ignore_errors = false
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_traceback = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true

# Generated protobuf / gRPC stubs: never type-check them.
[[tool.mypy.overrides]]
module = [
    "ondewo.t2s.text_to_speech_pb2",
    "ondewo.t2s.text_to_speech_pb2_grpc",
]
ignore_errors = true
ignore_missing_imports = true

# Third-party packages this repo actually imports without (complete) type stubs.
[[tool.mypy.overrides]]
module = [
    "dataclasses_json.*",
    "google.*",
    "grpc.*",
    "ondewo.utils.*",
    "requests.*",
    # imported only by examples/ (checked by the pre-commit mypy hook), not a dep.
    "soundfile.*",
]
ignore_missing_imports = true
