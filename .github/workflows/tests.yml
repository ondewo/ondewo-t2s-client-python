name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio

      # The repo is mostly generated protobuf/gRPC stubs; coverage is gated on the HAND-WRITTEN surface
      # (the D18 Keycloak offline-token auth helpers + the client config dataclass) — the
      # production-critical auth code this SDK owns. The generated *_pb2.py / *_pb2_grpc.py stubs are
      # intentionally NOT in --cov (they would only re-test protoc).
      - name: Unit tests + 100% coverage gate on hand-written code
        run: |
          pytest tests/unit -q \
            --cov=ondewo.t2s.client.utils.keycloak \
            --cov=ondewo.t2s.client.client_config \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100
