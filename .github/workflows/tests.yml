name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package + dev/test dependencies (from uv.lock)
        run: uv sync --extra dev --frozen

      - name: Ruff lint (replaces flake8)
        run: uv run --frozen ruff check .

      - name: Mypy type check
        run: uv run --frozen mypy ondewo

      # A bare `--cov` on purpose. The coverage targets live in pyproject.toml's
      # [tool.coverage.run] as a filesystem source (`source = ["ondewo"]`), so every .py under
      # ondewo/ is measured whether or not a test imports it. Enumerating dotted
      # `--cov=<module>` targets here instead made the gate fail OPEN: pytest-cov silently
      # drops a dotted target the suite never imports rather than scoring it 0%, so an
      # untested module vanished from the table and the gate still printed
      # "Required test coverage of 100% reached".
      - name: Unit tests + 100% coverage gate on hand-written code
        run: |
          uv run --frozen pytest tests/unit -q \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100
